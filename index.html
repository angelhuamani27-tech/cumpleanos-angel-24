:root{--night:#07111f;--navy:#102338;--paper:#f7f3eb;--gold:#dec28a;--muted:#b5bfca;--line:#dec28a30;--serif:Cormorant,Georgia,serif;--sans:'DM Sans',Arial,sans-serif;color-scheme:dark;font-family:var(--sans);font-synthesis:none;color:var(--paper);background:var(--night)}
*{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.6;background:radial-gradient(ellipse at 15% 10%,#1a354d70,transparent 55%),radial-gradient(ellipse at 95% 100%,#17334e60,transparent 50%);min-width:280px}h1,h2,p,figure{margin:0}a{color:inherit;text-decoration:none}button,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{color:inherit;cursor:pointer}img{display:block;width:100%;height:100%;object-fit:cover}button{border:0;background:none}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:5px}::selection{background:var(--gold);color:var(--night)}.icon{width:20px;height:20px;flex-shrink:0;vertical-align:middle}.invitation-page{min-height:100svh;display:grid;place-items:center;padding:30px}.invitation{display:grid;grid-template-columns:.95fr 1.05fr;max-width:960px;width:100%;border:1px solid var(--line);background:linear-gradient(140deg,#13283c,#0b192b);box-shadow:0 25px 100px #0004;position:relative}.invitation-photo{position:relative;min-width:0;min-height:560px;background:#13263a;overflow:hidden}.invitation-photo picture{display:block;position:absolute;inset:0}.invitation-photo img{object-position:54% 50%}.invitation-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#07111f80,transparent 45%),linear-gradient(90deg,transparent 65%,#10223655);pointer-events:none}.invitation-content{padding:55px 40px 32px;display:flex;flex-direction:column;justify-content:center;position:relative;min-width:0}.invitation-content:before{content:'';position:absolute;inset:15px;border:1px solid #dec28a12;pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--gold);line-height:1.7}.guest-greeting{font:italic 22px/1.3 var(--serif);color:var(--gold);margin-bottom:13px;overflow-wrap:anywhere}.invitation h1{font:400 clamp(55px,5.5vw,70px)/1.05 var(--serif);letter-spacing:-.045em;margin-top:11px}.invitation h1 em{color:var(--gold);font-weight:400}.invitation-note{font-size:11px;line-height:1.8;color:var(--muted);margin-top:12px;max-width:310px}.event-when{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-top:28px;padding:23px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.event-when>div{display:flex;align-items:flex-start;gap:11px;min-width:0}.event-when .icon{width:17px;height:17px;color:var(--gold);margin-top:3px}.event-when time{display:flex;flex-direction:column;gap:4px}.event-when strong{font-size:13px;font-weight:500;white-space:nowrap}.event-when time span{font-size:9px;line-height:1.5;color:var(--muted)}.event-place{display:flex;align-items:flex-start;gap:11px;margin-top:23px}.event-place>.icon{width:18px;height:18px;color:var(--gold);margin-top:3px}.event-place h2{font-size:15px;line-height:1.6;font-weight:500}.place-city{font-size:10px;color:var(--muted);margin-top:1px}.address{font-size:10px;line-height:1.8;color:var(--muted);margin-top:11px;max-width:300px}.location-actions{display:grid;gap:9px;margin-top:24px}.button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:13px;padding:11px 17px;font-size:11px;line-height:1.5;border:1px solid;transition:background .2s,transform .2s,color .2s;position:relative;z-index:1}.button .icon{width:17px;height:17px}.button-gold{color:var(--night);background:var(--gold);border-color:var(--gold);font-weight:600}.button-outline{color:#dac9a8;background:transparent;border-color:#dec28a45}.button:active{transform:scale(.985)}.closing{font:italic 23px/1.2 var(--serif);text-align:center;margin-top:22px;color:var(--gold)}.closing span{font:16px var(--serif);margin-left:8px}.toast{position:fixed;z-index:100;bottom:25px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);width:max-content;background:var(--paper);color:var(--night);padding:13px 20px;font-size:12px;transition:opacity .2s,transform .2s;box-shadow:0 6px 25px #0004}.toast.show{opacity:1;transform:translate(-50%,0)}.copy-dialog{max-width:min(420px,calc(100% - 32px));padding:26px;background:var(--navy);color:var(--paper);border:1px solid var(--line)}.copy-dialog h2{font:400 32px/1.1 var(--serif);margin-bottom:15px}.copy-dialog p{font-size:12px;color:var(--muted);margin-bottom:15px}.copy-dialog textarea{width:100%;padding:12px;background:var(--night);color:var(--paper);border:1px solid var(--line);margin-bottom:16px;resize:vertical;overflow-wrap:anywhere}.copy-dialog .button{width:100%}.copy-dialog::backdrop{background:#020711dd}.copy-fallback{position:fixed;left:-9999px;top:0}
@media(hover:hover){.button-gold:hover{background:#efdaa9;border-color:#efdaa9}.button-outline:hover{background:#dec28a0d;border-color:var(--gold)}}
@media(max-width:850px) and (min-width:601px){.invitation-page{padding:22px}.invitation{grid-template-columns:.85fr 1.15fr}.invitation-content{padding:40px 30px 28px}.invitation h1{font-size:57px}.event-when{gap:12px}.event-when>div{gap:8px}.event-when strong{font-size:12px}}
@media(max-width:600px){.invitation-page{padding:16px;min-height:100svh}.invitation{display:block;max-width:420px}.invitation-photo{height:clamp(155px,25svh,210px);min-height:0}.invitation-photo picture{inset:0}.invitation-photo img{object-position:50% 26%}.invitation-photo:after{background:linear-gradient(0deg,#10233899,transparent 50%)}.invitation-content{padding:25px 24px 22px}.invitation-content:before{inset:10px;border-top:0}.eyebrow{font-size:8px;letter-spacing:.14em}.guest-greeting{font-size:19px;margin-bottom:10px}.invitation h1{font-size:clamp(43px,12vw,55px);margin-top:8px;line-height:1.05}.invitation-note{font-size:10px;max-width:none;margin-top:8px}.event-when{margin-top:18px;padding:16px 0;gap:15px;grid-template-columns:1.3fr 1fr}.event-when>div{gap:8px}.event-when strong{font-size:12px}.event-when .icon{width:16px;height:16px}.event-when time span{font-size:8px}.event-place{margin-top:17px;gap:9px}.event-place h2{font-size:14px}.place-city{font-size:9px}.address{font-size:9px;line-height:1.75;margin-top:7px;max-width:none}.location-actions{margin-top:17px;gap:7px}.button{min-height:44px;font-size:11px;padding-block:10px}.closing{font-size:21px;margin-top:15px}.toast{bottom:18px;font-size:11px}}
@media(max-width:359px){.invitation-page{padding:12px}.invitation-content{padding:22px 20px 18px}.eyebrow{font-size:7px;letter-spacing:.12em}.invitation h1{font-size:44px}.event-when{gap:11px}.event-when strong{font-size:11px}.event-when>div{gap:6px}.event-when .icon{width:14px;height:14px}}
@media(max-height:720px) and (max-width:600px){.invitation-page{padding-block:12px}.invitation-photo{height:130px}.invitation-content{padding-top:21px;padding-bottom:18px}.invitation h1{font-size:44px}.event-when{padding-block:13px;margin-top:15px}.event-place{margin-top:14px}.location-actions{margin-top:14px}.closing{margin-top:12px}.guest-greeting{margin-bottom:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Cover and details are two views of the same invitation. */
[hidden]{display:none!important}
.opening{position:relative;height:100svh;min-height:560px;overflow:hidden;background:#07111f}
.opening-photo{position:absolute;inset:0 0 0 35%;display:block}
.opening-photo img{object-position:55% 42%;opacity:.78}

.opening-frame{position:absolute;inset:23px;border:1px solid #dec28a42;pointer-events:none}
.cover-top,.cover-bottom{position:absolute;left:6.7%;right:6.7%;display:flex;align-items:center;justify-content:space-between;gap:24px;z-index:1}
.cover-top{top:38px}.cover-top>.eyebrow{font-size:8px;letter-spacing:.23em}

.opening-content{position:absolute;left:7%;width:45%;top:50%;transform:translateY(-47%);text-align:center;z-index:1}
.opening-greeting{font-size:9px;letter-spacing:.2em;margin-bottom:24px;overflow-wrap:anywhere}
.opening h1{font:400 clamp(55px,6.5vw,98px)/1.05 var(--serif);letter-spacing:-.055em;white-space:nowrap;margin:0}
.opening-sub{font-size:11px;letter-spacing:.17em;color:#d5d9de;margin-top:16px}
.opening-age{position:relative;display:table;font:400 clamp(155px,18vw,245px)/1.04 var(--serif);letter-spacing:-.09em;color:var(--gold);margin:16px auto 10px;padding-right:9px}

.opening .button{min-width:245px;min-height:54px;font-size:9px;letter-spacing:.14em;gap:24px}
.cover-bottom{bottom:37px;color:#c4ccd4;font-size:9px;letter-spacing:.2em}
.cover-bottom>span:first-child{font:italic 19px/1.2 var(--serif);letter-spacing:0;color:var(--gold)}
.invitation-scene{width:100%;max-width:960px}

    if (copied) toast(message); else { $('#copy-value').value = text; $('#copy-dialog').showModal(); $('#copy-value').focus(); $('#copy-value').select(); }
  }
}

function Countdown() {
  const units=[['hours','Horas'],['minutes','Minutos'],['seconds','Segundos']];
  return `<section class="countdown" aria-labelledby="countdown-title">
    <p class="eyebrow">LA CUENTA REGRESIVA</p>
    <h2 id="countdown-title" aria-live="polite" aria-atomic="true">Falta muy poco.</h2>
    <div class="countdown-grid" role="timer" aria-label="Tiempo que falta para el cumpleaños" aria-live="off">${units.map(([key,label])=>`<div class="countdown-unit"><span class="countdown-number" id="count-${key}">00</span> <span class="countdown-label">${label}</span></div>`).join('')}</div>
  </section>`;
}
function initCountdown(c) {
  const start=Date.parse(startISO(c)), end=Date.parse(c.event.thankYouAt);
  const update=(selector,text)=>{
    const el=$(selector);
    if(el.textContent!==text)el.textContent=text;
  };
  const tick=()=>{
    const now=Date.now(), result=countdown(now,c);
    for(const key of ['hours','minutes','seconds']){
      const value=key==='hours'?result.days*24+result.hours:result[key];
      update('#count-'+key,String(value).padStart(2,'0'));
    }
    $('.countdown-grid').hidden=now>=start;
    update('#countdown-title',now>=end?'Una noche para recordar.':now>=start?'¡Hoy es el gran día!':'Falta muy poco.');
  };
  tick();
  document.addEventListener('visibilitychange',tick);
  window.addEventListener('pageshow',tick);
  return setInterval(tick,1000);
}

const guest=cleanText(new URLSearchParams(location.search).get('invitado'),80);
$('#app').innerHTML=`<main>${OpeningScreen(c,guest)}<section class="invitation-page" id="invitacion" aria-label="Datos de la invitación" hidden><div class="invitation-scene">${Hero(c,guest)}</div></section></main><div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div><dialog id="copy-dialog" class="copy-dialog" aria-labelledby="copy-title"><h2 id="copy-title">Comparte la ubicación</h2><p>Copia este enlace y envíalo a quien quieras.</p><textarea id="copy-value" aria-label="Enlace de ubicación" readonly rows="3"></textarea><form method="dialog"><button class="button button-gold">Listo</button></form></dialog>`;
if(c.features.countdown)initCountdown(c);

function showScene(focus=false){
  const details=location.hash==='#invitacion';
  $('#inicio').hidden=details;
  $('#invitacion').hidden=!details;
  if(focus){
    const incoming=details?$('#invitacion'):$('#inicio');
    const outgoing=details?$('#inicio'):$('#invitacion');
    outgoing.classList.remove('scene-enter');
    incoming.classList.add('scene-enter');
    const target=details?$('#invitation-title'):$('#opening-name');
    target.setAttribute('tabindex','-1');target.focus({preventScroll:true});
    window.scrollTo(0,0);
  }
}
showScene();
window.addEventListener('hashchange',()=>showScene(true));

$('#share-location').addEventListener('click',async()=>{
  const data={title:`Ubicación del cumpleaños de ${c.celebrant.displayName}`,text:`${c.location.name}, ${c.location.city} · ${c.event.displayDate} · ${c.event.displayTime}`,url:c.location.mapsUrl};
  if(navigator.share){
    try{await navigator.share(data);return;}
    catch(error){if(error.name==='AbortError')return;}
  }
  await copyText(c.location.mapsUrl,'Enlace de ubicación copiado');
});

})();</script><script id="enrique-temporal">(() => {
  const startsAt = 1792464415825, expiresAt = 1792465200000;
  const greeting = document.querySelector('.opening-greeting');
  const self = document.currentScript;
  if (!greeting || Date.now() >= expiresAt) { self?.remove(); return; }
  const original = greeting.innerHTML;
  const originalClass = greeting.className;
  let timer, style, active = false;
  function restore() {
    if (active) { greeting.innerHTML = original; greeting.className = originalClass; }
    style?.remove(); style = undefined; active = false;
  }
  function update() {
    clearTimeout(timer);
    const now = Date.now();
    if (now >= expiresAt) {
      restore();
      window.removeEventListener('pageshow', update);
      document.removeEventListener('visibilitychange', update);
      self?.remove();
      return;
    }
    if (now >= startsAt && !active) {
      style = document.createElement('style');
      style.id = 'enrique-temporal-style';
      style.textContent = '.opening-greeting.enrique-temporal{display:flex;align-items:baseline;justify-content:center;gap:10px;color:var(--gold)}.enrique-temporal>span{font:400 9px/1.3 var(--sans);letter-spacing:.22em}.enrique-temporal>strong{font:500 clamp(23px,3vw,30px)/1.2 var(--serif);letter-spacing:.09em}';
      document.head.append(style);
      greeting.classList.add('enrique-temporal');
      greeting.innerHTML = '<span>PARA</span><strong>ENRIQUE</strong>';
      active = true;
    } else if (now < startsAt && active) restore();
    timer = setTimeout(update, (now < startsAt ? startsAt : expiresAt) - now);
  }
  window.addEventListener('pageshow', update);
  document.addEventListener('visibilitychange', update);
  update();
})();</script></body>
